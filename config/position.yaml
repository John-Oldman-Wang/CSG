# 仓位与组合约束规则（L5 决策层）
#
# ⚠️ 本文件的作用不是「帮你决定买多少」，而是**在你违反自己定的规则时拦住你**。
#
# 机构投资者最大的制度优势不是选股方法（其公开输出已验证无预测力），
# 而是把「不能做什么」写进风控系统——基金经理情绪上头时，系统会拒绝下单。
# 个人投资者最大的劣势不是信息，是没有任何东西拦得住自己。
#
# 本文件纳入 git，每次修改留下 commit 记录。
# 复盘时能看到：业绩变化是市场原因，还是你偷偷放宽了规则。

# ------------------------------------------------------------------
# 组合规模
# ------------------------------------------------------------------
portfolio:
  # 计划持仓只数。
  #
  # 集中 vs 分散的取舍：
  #   3-5 只   单只判断错误的代价极大，但认知深度可以做到最好
  #   8-15 只  单只错误可承受，仍能保持对每只的深度理解
  #   20+ 只   实际上无法维持对每只的跟踪，退化为准指数
  #
  # 回测数据（2018-2025，20 只等权）：最大回撤 −64.5%。
  # 更集中意味着更深的回撤——请据此设定，而非据「我看好就多买」。
  target_count: 8
  min_count: 5
  max_count: 15

  # 最低现金比例。
  # 留现金不是保守，是保留选择权：
  # 回测中 2024 年初是区间最佳买点，而满仓者只能旁观。
  min_cash_ratio: 0.15

# ------------------------------------------------------------------
# 单一标的上限
# ------------------------------------------------------------------
single_position:
  # 单只占总资产上限。
  # 依据：你对一家公司的判断正确率若为 70%（已属优秀），
  # 满仓单只意味着 30% 的概率让全部资产承受该错误。
  max_weight: 0.15

  # 首次建仓上限——留出加仓空间，也限制「一见钟情」的代价
  initial_weight: 0.08

  # 加仓规则必须事先写死。
  # 否则「越跌越买」与「摊薄成本自欺」在事后无法区分。
  add_position:
    # 仅在复核结论为「情绪面」（假设未被动摇）时允许加仓
    require_review_verdict: sentiment
    # 单次加仓幅度上限
    max_step: 0.05
    # 两次加仓的最小间隔（日），防止情绪化连续补仓
    min_interval_days: 30

# ------------------------------------------------------------------
# 集中度约束
# ------------------------------------------------------------------
concentration:
  # 单行业上限。
  # 防止「选出 5 只好公司，结果全是电池」——
  # 那看着分散，实际是一个赌注。
  max_industry_weight: 0.40

  # 单主题上限（new_energy / ai_compute）。
  # 本项目股票池本身就集中在两个主题，故此项尤其重要。
  max_theme_weight: 0.60

  # 相关性约束：持仓间日收益相关系数长期高于此值的组合，
  # 其实际分散度低于表面只数。
  correlation_warn: 0.75

# ------------------------------------------------------------------
# 总仓位与市场水位联动
# ------------------------------------------------------------------
# 用途限定（见 METHODOLOGY 原则 2）：
# 市场估值分位**只用于设定总仓位上下限**，不产生个股买卖信号。
market_level:
  enabled: false          # 需要全市场估值分位数据，待 L0 层补齐后启用
  bands:
    - { percentile_below: 0.30, max_total: 1.00 }   # 市场低位，可满仓
    - { percentile_below: 0.70, max_total: 0.85 }
    - { percentile_below: 1.00, max_total: 0.60 }   # 市场高位，压降仓位

# ------------------------------------------------------------------
# 卖出规则
# ------------------------------------------------------------------
# ⚠️ 混合派定位：价格下跌**不构成**卖出理由。
#    止损仅在「假设被证伪」时执行，触发条件是基本面事件。
exit:
  # 允许的卖出理由（必须归类，用于复盘统计）
  reasons:
    - assumption_falsified   # 证伪条件被触发
    - overvalued             # 估值过高
    - better_opportunity     # 换更好标的
    - disciplined_stop       # 纪律止损（兜底线）
    - emotional              # 情绪操作 ← 必须诚实填写，这是复盘最有价值的输入

  # 绝对兜底线：防范黑天鹅与判断完全失效。
  # 触发时**仍须走完复核流程并记录结论**，不允许静默机械执行。
  hard_stop_drawdown: -0.40

  # 单只标的连续多少期复核为「信息不足」后强制处理，
  # 防止用「再看看」无限期回避决策
  max_insufficient_reviews: 3
