# 股票池定义
#
# 分层依据见 docs/METHODOLOGY.md 第二节：
#   L0 全市场  仅轻量数据，用于行业分位/市场水位/超额跌幅，不做个股分析
#   L1 基础池  定期筛选的范围  ← 本文件定义
#   L2 观察池  人工研究后加入（运行时数据，不在此配置）
#   L3 持仓    最高强度跟踪（运行时数据）
#
# 行业分类来源：东财「所处行业」字段（经 stock_yjbb_em 批量获取）。
# ⚠️ 局限：只有当前分类，无历史变更记录。回测跨度较长时，
#    早期年份的行业归属可能与当时不符。影响有限但需知晓。

# ------------------------------------------------------------------
# L1 基础池：核心 + 扩展
# ------------------------------------------------------------------

core:
  new_energy:
    - 光伏设备      # 68
    - 电池          # 106
    - 风电设备      # 31
    - 能源金属      # 11
  ai_compute:
    - 半导体        # 185
    - 计算机设备    # 89
    - 软件开发      # 134

# 与主题相关但混杂度高：汽车零部件多为传统燃油车配套，
# 电网设备中仅部分属储能/特高压，消费电子与 AI 的关联多为概念映射。
# 默认不启用，需要时把 enabled 改为 true。
extended:
  enabled: false
  new_energy:
    - 汽车零部件    # 278
    - 电网设备      # 143
  ai_compute:
    - 通信设备      # 91  含光模块，与算力关联度较高
    - 消费电子      # 99
    - 光学光电子    # 99

# ------------------------------------------------------------------
# 能力圈边界（见 METHODOLOGY.md ① 排除环节）
# ------------------------------------------------------------------
# 这是给自己戴的镣铐：防止某天热点来了给自己找理由破例。
# 纳入 git，每次修改留记录，复盘时能看到破了几次戒。

circle_of_competence:
  # 明确不看的行业。待补充 —— 建议用一段时间后再填，
  # 凭空想出来的边界不如踩过坑之后画出来的准。
  exclude_industries: []

  # 硬性排除条件
  exclude_rules:
    min_list_years: 1          # 上市不满 1 年不看（无足够财报历史）
    exclude_st: true           # ST / *ST
    min_market_cap: 3.0e+9     # 市值下限 30 亿：流动性与治理风险

# ------------------------------------------------------------------
# 数据采集范围
# ------------------------------------------------------------------

data_range:
  # 起始年份定为 2016：
  #   - 覆盖新能源完整的一轮产能周期（2016 补贴期 → 2018 退坡 →
  #     2020 爆发 → 2022 高点 → 2023+ 产能过剩价格战）
  #   - 磁盘剩余 48 GB，全市场十年日线约 300-450 MB，可承受
  start_date: "2016-01-01"

  # L0 全市场层：只采集轻量字段
  market_wide:
    enabled: true
    fields: [close, pe_ttm, pb, total_mv, circ_mv]

  # L1 基础池：完整行情 + 三大报表 + 披露日期
  universe_deep:
    enabled: true
