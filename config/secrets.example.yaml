# 密钥配置模板 —— 复制为 secrets.yaml 并填入真实值
#
# secrets.yaml 已在 .gitignore 中，不会被提交。本模板会被提交。

tushare:
  token: "your-tushare-token"

feishu:
  # 飞书群 → 群机器人 → 添加自定义机器人 → 复制 Webhook 地址
  # 建议建两个群：P0 开强提醒，P1 普通通知。
  # 混在一个群会导致用户最终静音整个群，提醒系统失效。
  p0:
    webhook: "https://open.feishu.cn/open-apis/bot/v2/hook/xxxxxxxx"
    secret: ""       # 开启「签名校验」时填写
  p1:
    webhook: "https://open.feishu.cn/open-apis/bot/v2/hook/xxxxxxxx"
    secret: ""
