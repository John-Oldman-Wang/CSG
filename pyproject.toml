[project]
name = "csg"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "王琳", email = "mag1c_shen_09@foxmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "akshare>=1.18.91",
    "baostock>=0.9.3",
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "pandas>=2.2,<3.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.1",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
csg = "csg:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
target-version = "py312"
line-length = 92

[tool.ruff.lint]
# 保持默认规则集，仅豁免与本项目语境冲突的检查
extend-ignore = [
    # 本地个人项目全程使用本地时间；交易日期本身无时区语义
    "DTZ005", "DTZ011",
]
