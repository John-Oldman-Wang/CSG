[project]
name = "csg"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "王琳", email = "mag1c_shen_09@foxmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "akshare>=1.18.91",
    "duckdb>=1.5.5",
    "pandas>=2.2,<3.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.scripts]
csg = "csg:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
